<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Game Price Tracker{% endblock %}</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a22;
      --border: #2a2a35;
      --text: #e8e8ed;
      --muted: #9a9aab;
      --accent: #0070d1;
      --accent2: #00d4ff;
      --good: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 920px; margin: 0 auto; padding: 1.5rem; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
      margin-bottom: 1.5rem;
      flex-wrap: wrap; gap: 0.75rem;
    }
    header .logo { font-weight: 700; font-size: 1.2rem; color: var(--text); }
    header .logo span { color: var(--accent2); }
    header nav a { color: var(--muted); margin-left: 1rem; font-size: 0.9rem; }
    header nav a:hover { color: var(--accent2); }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
    }
    .badge.physical { background: #1e3a5f; color: #7dd3fc; }
    .badge.digital { background: #1a3a2a; color: #86efac; }
    .badge.used { background: #3a2a1a; color: #fcd34d; }
    .badge.lowest { background: #14532d; color: #86efac; }
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="container">
    <header>
      <div>
        <a href="/" class="logo">Game <span>Price</span> Tracker</a>
      </div>
      <nav>
        <a href="/">Tracked</a>
        <a href="{% url 'games:steam_search' %}">Search Steam</a>
        <a href="/admin/">Admin</a>
      </nav>
    </header>

    {% block content %}{% endblock %}

    <footer>
      Steam public API + careful sources. Price history is built from your own snapshots (not Steam's historical API).
    </footer>
  </div>
</body>
</html>
