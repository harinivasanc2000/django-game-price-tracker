<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Game Price Tracker{% endblock %}</title>
  <style>
    :root {
      --bg: #0a0505;
      --card: #140a0a;
      --border: #3a1515;
      --text: #f0e6e6;
      --muted: #a89090;
      --accent: #8b1515;
      --accent2: #e03030;
      --good: #3ecf6a;
      --warn: #e8a838;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(120, 20, 20, 0.35), transparent 55%),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(60, 10, 10, 0.4), transparent 50%),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(90, 15, 15, 0.25), transparent 45%),
        #0a0505;
      background-size: 200% 200%;
      animation: wallpaperShift 28s ease-in-out infinite alternate;
    }
    @keyframes wallpaperShift {
      0% { background-position: 0% 40%, 100% 60%, 50% 100%; }
      100% { background-position: 30% 60%, 70% 30%, 40% 80%; }
    }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 960px; margin: 0 auto; padding: 1.5rem; position: relative; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 1rem 0; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;
    }
    header .logo { font-weight: 700; font-size: 1.2rem; color: var(--text); }
    header .logo span { color: var(--accent2); }
    header nav a { color: var(--muted); margin-left: 1rem; font-size: 0.9rem; }
    header nav a:hover { color: var(--accent2); }
    .badge {
      display: inline-block; font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 0.2rem 0.5rem; border-radius: 4px;
      background: var(--border); color: var(--muted);
    }
    .badge.physical { background: #1e3a5f; color: #7dd3fc; }
    .badge.digital { background: #1a3a2a; color: #86efac; }
    .badge.used { background: #3a2a1a; color: #fcd34d; }
    .badge.lowest { background: #14532d; color: #86efac; }
    .badge.dlc { background: #3a1520; color: #f0a0a0; }
    .price-now { font-weight: 700; color: var(--accent2); }
    .price-was {
      text-decoration: line-through; color: var(--muted);
      font-size: 0.85em; margin-right: 0.35rem;
    }
    footer {
      margin-top: 3rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted); font-size: 0.85rem;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="logo">Game <span>Price</span> Tracker</a>
      <nav>
        <a href="/">Tracked</a>
        <a href="{% url 'games:steam_search' %}">Search</a>
        <a href="{% url 'games:history' %}">History</a>
        <a href="/admin/">Admin</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer>
      Dark red theme · Click a title to view — Track only when you choose.
    </footer>
  </div>
</body>
</html>
