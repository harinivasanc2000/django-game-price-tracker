{# Search + platform filter + live suggestions #}
<div class="search-wrap" style="position: relative; width: 100%;">
  <form class="search-row" method="get" action="{% url 'games:steam_search' %}" id="steamSearchForm" autocomplete="off">
    <input
      type="text"
      name="q"
      id="steamSearchInput"
      value="{{ q|default:'' }}"
      placeholder="{{ placeholder|default:'Search games…' }}"
      role="combobox"
      aria-label="Search games"
      aria-autocomplete="list"
      aria-controls="suggestDropdown"
      aria-expanded="false"
      aria-haspopup="listbox"
      {% if autofocus %}autofocus{% endif %}
    >
    <select name="platform" id="platformSelect" title="Platform">
      <option value="" {% if not current_platform %}selected{% endif %}>All</option>
      <option value="pc" {% if current_platform == 'pc' %}selected{% endif %}>PC</option>
      <option value="ps4" {% if current_platform == 'ps4' %}selected{% endif %}>PS4</option>
      <option value="ps5" {% if current_platform == 'ps5' %}selected{% endif %}>PS5</option>
      <option value="xbox" {% if current_platform == 'xbox' %}selected{% endif %}>Xbox</option>
      <option value="switch" {% if current_platform == 'switch' %}selected{% endif %}>Switch</option>
    </select>
    <button type="submit">Search</button>
  </form>
  <div id="suggestDropdown" class="suggest-dd" role="listbox" aria-label="Game suggestions" hidden></div>
</div>

<style>
  .search-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .search-row input {
    flex: 1; min-width: 140px; padding: 0.85rem 1rem; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 1rem; outline: none;
  }
  .search-row input:focus { border-color: var(--accent2); }
  .search-row select {
    padding: 0.85rem 0.75rem; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 0.9rem;
  }
  .search-row button {
    padding: 0.85rem 1.2rem; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
  }
  .search-row button:hover { filter: brightness(1.12); }
  .suggest-dd {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; max-height: 340px; overflow-y: auto;
    z-index: 50; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  .suggest-item {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.65rem 0.9rem; cursor: pointer; border-bottom: 1px solid var(--border);
    color: var(--text); text-decoration: none !important;
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover, .suggest-item.active { background: #1f0c0c; }
  .suggest-item img {
    width: 72px; height: 27px; object-fit: cover; border-radius: 4px; background: var(--border);
  }
  .suggest-item .s-name { flex: 1; font-size: 0.92rem; }
  .suggest-item .s-meta { font-size: 0.75rem; color: var(--muted); }
</style>

<script>
(function () {
  const input = document.getElementById('steamSearchInput');
  const dd = document.getElementById('suggestDropdown');
  if (!input || !dd) return;

  let timer = null;
  let active = -1;
  let requestController = null;
  let requestVersion = 0;

  function suggestionHref(appId) {
    const platform = (document.getElementById('platformSelect') || {}).value || '';
    return `/steam/${appId}/${platform ? '?platform=' + encodeURIComponent(platform) : ''}`;
  }

  function clearActive() {
    active = -1;
    input.removeAttribute('aria-activedescendant');
    dd.querySelectorAll('.suggest-item').forEach((node) => {
      node.classList.remove('active');
      node.setAttribute('aria-selected', 'false');
    });
  }

  function hide() {
    clearActive();
    dd.hidden = true;
    input.setAttribute('aria-expanded', 'false');
  }

  function invalidatePendingRequest() {
    requestVersion += 1;
    if (requestController) requestController.abort();
    requestController = null;
  }

  function setActive(next, nodes) {
    clearActive();
    if (next < 0 || next >= nodes.length) return;
    active = next;
    const node = nodes[active];
    node.classList.add('active');
    node.setAttribute('aria-selected', 'true');
    input.setAttribute('aria-activedescendant', node.id);
    node.scrollIntoView({ block: 'nearest' });
  }

  function updateSuggestionLinks() {
    dd.querySelectorAll('.suggest-item').forEach((node) => {
      const appId = Number(node.dataset.appId);
      if (Number.isInteger(appId) && appId > 0) node.href = suggestionHref(appId);
    });
    clearActive();
  }

  function render(list) {
    clearActive();
    const items = (list || []).filter((suggestion) => {
      const appId = Number(suggestion.app_id);
      return Number.isInteger(appId) && appId > 0;
    });
    if (!items.length) { hide(); return; }
    const fragment = document.createDocumentFragment();
    items.forEach((s, i) => {
      const appId = Number(s.app_id);
      const price = s.price_status === 'free' ? 'Free'
        : s.price_status === 'unknown' ? 'Unknown'
        : (s.price ? s.price + ' ' + (s.currency || '') : 'Unknown');
      const dlc = s.is_likely_dlc ? ' · DLC?' : '';
      const link = document.createElement('a');
      link.className = 'suggest-item';
      link.dataset.i = String(i);
      link.dataset.appId = String(appId);
      link.id = `steam-suggestion-${i}`;
      link.setAttribute('role', 'option');
      link.setAttribute('aria-selected', 'false');
      link.href = suggestionHref(appId);

      // Suggestions come from a remote catalogue. Build text nodes instead of
      // interpolating remote titles/URLs into innerHTML.
      let imageNode;
      try {
        const imageUrl = new URL(String(s.tiny_image || ''), window.location.origin);
        if (!['http:', 'https:'].includes(imageUrl.protocol)) throw new Error('unsafe image');
        imageNode = document.createElement('img');
        imageNode.src = imageUrl.href;
        imageNode.alt = '';
        imageNode.loading = 'lazy';
      } catch (error) {
        imageNode = document.createElement('div');
        imageNode.style.cssText = 'width:72px;height:27px;background:var(--border);border-radius:4px;';
      }
      link.appendChild(imageNode);

      const name = document.createElement('div');
      name.className = 's-name';
      name.appendChild(document.createTextNode(String(s.name || 'Unknown title')));
      const meta = document.createElement('div');
      meta.className = 's-meta';
      meta.textContent = `${price}${dlc}`;
      name.appendChild(meta);
      link.appendChild(name);
      fragment.appendChild(link);
    });
    dd.replaceChildren(fragment);
    dd.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  }

  function fetchSuggest(q) {
    if (q.length < 2) { invalidatePendingRequest(); hide(); return; }
    if (requestController) requestController.abort();
    requestController = typeof AbortController === 'undefined' ? null : new AbortController();
    const version = ++requestVersion;
    const options = requestController ? { signal: requestController.signal } : {};
    fetch(`/api/suggest/?q=${encodeURIComponent(q)}&cc=GB`, options)
      .then((response) => {
        if (!response.ok) throw new Error(`Suggestion request failed (${response.status})`);
        return response.json();
      })
      .then((data) => {
        // Ignore a late response if the user has already changed the query.
        if (version !== requestVersion || input.value.trim() !== q) return;
        render(data.suggestions || []);
      })
      .catch((error) => {
        if (error && error.name === 'AbortError') return;
        if (version === requestVersion) hide();
      })
      .finally(() => {
        if (version === requestVersion) requestController = null;
      });
  }

  input.addEventListener('input', () => {
    clearTimeout(timer);
    invalidatePendingRequest();
    hide();
    const q = input.value.trim();
    if (q.length < 2) return;
    timer = setTimeout(() => fetchSuggest(q), 220);
  });

  input.addEventListener('keydown', (e) => {
    const nodes = dd.querySelectorAll('.suggest-item');
    if (e.key === 'ArrowDown' && !dd.hidden && nodes.length) {
      e.preventDefault();
      setActive(Math.min(active + 1, nodes.length - 1), nodes);
    } else if (e.key === 'ArrowUp' && !dd.hidden && nodes.length) {
      e.preventDefault();
      setActive(active < 0 ? nodes.length - 1 : Math.max(active - 1, 0), nodes);
    } else if (e.key === 'Enter' && active >= 0 && nodes[active]) {
      e.preventDefault();
      window.location = nodes[active].href;
    } else if (e.key === 'Escape') {
      invalidatePendingRequest();
      hide();
    }
  });

  const platform = document.getElementById('platformSelect');
  if (platform) platform.addEventListener('change', updateSuggestionLinks);

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      invalidatePendingRequest();
      hide();
    }
  });
})();
</script>
